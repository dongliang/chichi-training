<meta charset="utf-8">
<title>Chichi 训练手册</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1ED" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#111714" media="(prefers-color-scheme:dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chichi 手册">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%232C6A50'/%3E%3Ctext x='90' y='120' font-size='96' font-family='serif' fill='%23FBFCFA' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">

<style>
/* Layout concept: 临床训练手册 —— 左侧固定目录栏，右侧是带编号的训练卡，
   原文引用像脚注一样贴在卡片下沿。 */
:root{
  --paper:#EEF1ED;
  --surface:#FBFCFA;
  --surface-2:#E5EAE4;
  --ink:#17231E;
  --ink-2:#4A5A53;
  --ink-3:#7E8D86;
  --line:#D3DBD4;
  --line-2:#B7C2B9;
  --accent:#2C6A50;
  --accent-ink:#1E4A37;
  --accent-soft:#DCEAE1;
  --gold:#95671F;
  --gold-soft:#F3E8D3;
  --danger:#9E3C2B;
  --danger-soft:#F5E1DB;
  --shadow:0 1px 2px rgba(23,35,30,.05),0 10px 26px -18px rgba(23,35,30,.45);
  --r:13px;
  --font-display:"Noto Serif SC",Georgia,"Songti SC",serif;
  --font-body:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111714;
    --surface:#18211D;
    --surface-2:#202B26;
    --ink:#E7EDE8;
    --ink-2:#A6B5AE;
    --ink-3:#7C8B84;
    --line:#2B3833;
    --line-2:#3B4A44;
    --accent:#6FB394;
    --accent-ink:#8CC9AC;
    --accent-soft:#1D3229;
    --gold:#D6A75E;
    --gold-soft:#332817;
    --danger:#E08872;
    --danger-soft:#3A211C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111714;
  --surface:#18211D;
  --surface-2:#202B26;
  --ink:#E7EDE8;
  --ink-2:#A6B5AE;
  --ink-3:#7C8B84;
  --line:#2B3833;
  --line-2:#3B4A44;
  --accent:#6FB394;
  --accent-ink:#8CC9AC;
  --accent-soft:#1D3229;
  --gold:#D6A75E;
  --gold-soft:#332817;
  --danger:#E08872;
  --danger-soft:#3A211C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:64px}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-wrap:break-word;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:10;background:var(--paper);
}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35;letter-spacing:.01em}
p{margin:0}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.shell{
  display:grid;
  grid-template-columns:252px minmax(0,1fr);
  max-width:1360px;
  margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  align-items:start;
}

/* ---------- rail ---------- */
.rail{
  position:sticky;top:0;
  height:100vh;
  height:100dvh;
  display:flex;flex-direction:column;
  gap:18px;
  padding:26px 20px 18px 0;
  border-right:1px solid var(--line);
  min-width:0;
}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .mark{
  font-family:var(--font-body);font-size:11px;letter-spacing:.06em;
  color:var(--accent);font-weight:500;
}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.search{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 10px;
}
.search svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
.search input{
  border:0;background:transparent;outline:none;width:100%;min-width:0;
  font-family:var(--font-body);font-size:13px;color:var(--ink);
}
.search input::placeholder{color:var(--ink-3)}

.nav{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -8px;padding:0 8px 8px;scrollbar-width:thin}
.nav-group{margin-bottom:16px}
.nav-group-head{
  display:flex;align-items:baseline;gap:8px;
  padding:0 6px 5px;cursor:default;
}
.nav-group-head .n{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;
}
.nav-group-head .t{
  font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase;
}
.nav-link{
  display:grid;grid-template-columns:34px minmax(0,1fr) 12px;
  align-items:start;gap:7px;
  width:100%;text-align:left;
  background:none;border:0;cursor:pointer;
  padding:5px 6px;border-radius:7px;
  font-size:13px;line-height:1.45;color:var(--ink-2);
  transition:background .12s,color .12s;
}
.nav-link:hover{background:var(--surface-2);color:var(--ink)}
.nav-link .idx{
  font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);padding-top:4px;white-space:nowrap;
}
.nav-link.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.nav-link.active .idx{color:var(--accent)}
.nav-link .tick{color:var(--accent);font-size:11px;padding-top:3px;opacity:0}
.nav-link.done .tick{opacity:1}
.nav-empty{font-size:12px;color:var(--ink-3);padding:10px 6px}

.rail-foot{
  border-top:1px solid var(--line);padding-top:13px;
  display:flex;flex-direction:column;gap:9px;
}
.prog-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prog-label{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.prog-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog-bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.rail-links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rail-links button{
  min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:6px 4px;font-size:11.5px;color:var(--ink-2);cursor:pointer;
  transition:.12s;
}
.rail-links button:hover{border-color:var(--line-2);color:var(--ink)}
.rail-links button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- main ---------- */
.main{min-width:0;padding:0 0 90px 40px}
.topbar{display:none}

.wrap{max-width:820px}
.eyebrow{
  font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;
  color:var(--accent);font-weight:500;margin-bottom:10px;
}

/* home */
.hero{padding:52px 0 8px}
.hero h1{font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero .lede{margin-top:16px;font-size:16px;color:var(--ink-2);max-width:56ch;line-height:1.8}
.hero .meta{
  margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 18px;
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.03em;
}
.hero .meta b{color:var(--ink-2);font-weight:500}

.strip{
  margin-top:30px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;
}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;
}
.stat .k{font-size:11px;color:var(--ink-3);letter-spacing:.05em}
.stat .v{font-family:var(--font-mono);font-size:23px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink-3);font-family:var(--font-body);font-weight:400}

.block{margin-top:52px}
.block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:5px}
.block-head .num{
  font-family:var(--font-mono);font-size:11px;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;padding:0 5px;line-height:1.6;
}
.block-head h2{font-size:21px;font-weight:700}
.block-sub{font-size:13.5px;color:var(--ink-3);margin-bottom:20px;max-width:60ch}

.path{display:grid;gap:0}
.path-item{
  display:grid;grid-template-columns:36px minmax(0,1fr) auto;
  gap:14px;align-items:start;
  padding:13px 0;border-bottom:1px solid var(--line);
  text-align:left;background:none;border-left:0;border-right:0;border-top:0;
  cursor:pointer;width:100%;color:inherit;
}
.path-item:last-child{border-bottom:0}
.path-item:hover .path-title{color:var(--accent)}
.path-item .step{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);
  padding-top:4px;font-variant-numeric:tabular-nums;
}
.path-item .t{display:block;min-width:0}
.path-title{display:block;font-size:15px;font-weight:700;transition:color .12s}
.path-desc{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.6}
.path-tag{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap;margin-top:3px;
}

.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ch-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 16px;text-align:left;cursor:pointer;color:inherit;
  display:flex;flex-direction:column;gap:6px;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.ch-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.ch-card .n{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.ch-card .ch-title{display:block;font-family:var(--font-display);font-size:16.5px;font-weight:700;line-height:1.35}
.ch-card .ch-sub{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.ch-card .count{
  margin-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);
}

.note{
  background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 26%,transparent);
  border-radius:var(--r);padding:16px 18px;font-size:13.5px;line-height:1.75;color:var(--ink-2);
}
.note b{color:var(--ink)}
.note h3{font-size:14px;margin-bottom:7px;color:var(--ink)}
.note ul{margin:8px 0 0;padding-left:18px}
.note li{margin-bottom:4px}

/* lesson */
.lesson{padding-top:34px;max-width:760px}
.lesson .crumb{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;
  margin-bottom:14px;
}
.lesson .crumb .sep{opacity:.5}
.lesson h1{font-size:clamp(25px,3.6vw,33px);font-weight:700;letter-spacing:-.005em}
.lesson .lede{
  margin-top:13px;font-size:16px;color:var(--ink-2);line-height:1.75;
  padding-left:15px;border-left:2px solid var(--accent);
}
.lesson .body-text{margin-top:20px;font-size:15px;color:var(--ink-2);line-height:1.85;max-width:62ch}

.sub-head{
  display:flex;align-items:center;gap:9px;margin:34px 0 14px;
}
.sub-head .lbl{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}
.sub-head .rule{flex:1;height:1px;background:var(--line)}
.sub-head .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}

.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:16px}
.steps li{
  counter-increment:s;
  display:grid;grid-template-columns:25px minmax(0,1fr);gap:14px;
  font-size:14.5px;line-height:1.8;color:var(--ink);
}
.steps li::before{
  content:counter(s,decimal-leading-zero);
  font-family:var(--font-mono);font-size:10.5px;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:50%;width:25px;height:25px;
  display:flex;align-items:center;justify-content:center;
  margin-top:3px;
}
.steps li b{font-weight:700}

.pitfalls{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.pitfalls li{
  background:var(--danger-soft);
  border-left:2px solid var(--danger);
  border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:13.5px;line-height:1.7;color:var(--ink);
}
.pitfalls li b{color:var(--danger);font-weight:700}

.quote{
  margin:30px 0 0;
  background:var(--gold-soft);
  border:1px solid color-mix(in srgb,var(--gold) 24%,transparent);
  border-radius:var(--r);
  padding:17px 19px 15px;
}
.quote .en{
  font-size:13.5px;line-height:1.75;color:var(--ink);
  font-style:italic;
}
.quote .zh{
  margin-top:0;font-size:14px;line-height:1.8;color:var(--ink);
}
.quote .src{
  margin-top:11px;padding-top:9px;
  border-top:1px solid color-mix(in srgb,var(--gold) 22%,transparent);
  font-family:var(--font-mono);font-size:10.5px;color:var(--gold);letter-spacing:.03em;
}

.gap-note{
  margin-top:18px;padding:13px 16px;border-radius:9px;
  background:var(--surface-2);font-size:13px;line-height:1.7;color:var(--ink-2);
}
.gap-note b{color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.vid-chips{display:grid;gap:8px;margin-top:12px}
.vid-chip{
  display:grid;grid-template-columns:148px minmax(0,1fr);gap:0;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:0;overflow:hidden;text-align:left;cursor:pointer;color:inherit;width:100%;
  transition:.12s;
}
.vid-chip:hover{border-color:var(--accent)}
.vid-chip.on{border-color:var(--accent)}
.vid-chip .vthumb{
  position:relative;display:block;width:128px;aspect-ratio:16/9;
  margin:10px;border-radius:8px;
  background:var(--surface-2);overflow:hidden;
}
.vid-chip .vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vid-chip .vplay{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 2px 8px rgba(0,0,0,.28);
}
.vid-chip .vplay svg{width:9px;height:9px;fill:#17231E;margin-left:1px}
.vid-chip .vtxt{min-width:0;padding:10px 12px 10px 0}
@media (min-width:700px){
  .vid-chip{grid-template-columns:220px minmax(0,1fr)}
  .vid-chip .vthumb{width:196px}
  .vid-chip .vplay{width:36px;height:36px}
  .vid-chip .vplay svg{width:12px;height:12px}
  .vid-chip .vtxt{padding:12px 16px 13px 16px}
  .vid-chip .vttl{font-size:14.5px}
  .vid-chip .vten{font-size:12px}
  .vid-chip .vwhy{font-size:12.5px}
}
.vid-chip .vttl{display:block;font-size:12.5px;font-weight:600;line-height:1.45}
.vid-chip .vten{
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  font-size:11.5px;color:var(--ink-3);line-height:1.45;overflow-wrap:anywhere;
}
.vid-chip .vwhy{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.vid-chip .vmeta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:2px;
}
.vid-chip .vtopic{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  color:var(--accent);text-transform:uppercase;
}
.vid-chip .vdur{
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.vid-chip.on{border-color:var(--accent);background:var(--accent-soft)}
.vid-chip.on .vplay{background:var(--accent)}
.vid-chip.on .vplay svg{fill:#fff}

/* inline player (lesson page / videos page) */
.vid-player-slot{margin:14px 0 22px}
.vid-player-slot:empty{display:none;margin:0}
.vid-player{
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--surface);
}
.vp-frame{position:relative;aspect-ratio:16/9;background:#0b1210}
.vp-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vp-fb{position:relative;display:block;width:100%;height:100%;overflow:hidden}
.vp-fb img{width:100%;height:100%;object-fit:cover;display:block}
.vp-fb::after{content:"";position:absolute;inset:0;background:rgba(8,14,11,.36)}
.vp-fb .vp-fb-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;
  width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 14px rgba(0,0,0,.3);
}
.vp-fb .vp-fb-play svg{width:18px;height:18px;fill:#17231E;margin-left:2px}
.vp-fb .vp-fb-txt{
  position:absolute;left:0;right:0;bottom:14px;z-index:1;text-align:center;
  color:#fff;font-size:12px;text-shadow:0 1px 5px rgba(0,0,0,.6);
}
.vp-meta{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;
  padding:12px 14px;border-top:1px solid var(--line);
}
.vp-txt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.vp-topic{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.vp-title{font-size:14px;font-weight:700;line-height:1.45}
.vp-title-en{font-size:12px;color:var(--ink-3);line-height:1.5;overflow-wrap:anywhere}
.vp-why{font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:2px}
.vp-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vp-acts a{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.vp-acts a:hover{text-decoration:underline}
.vp-dur{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vp-acts button{
  background:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px;
  font-size:11.5px;color:var(--ink-2);cursor:pointer;transition:.12s;
  max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.vp-acts button:hover{border-color:var(--accent);color:var(--accent)}
.chip{
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  transition:.12s;
}

}

function isDone(id){ return !!done[id]; }

function paintProgress(){
  var n = L.filter(function(x){ return isDone(x.id); }).length;

}

/* ---------------- helpers ---------------- */

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function chOf(id){
  var l = byId[id];
  if(!l) return null;
  return CHAPTERS.filter(function(c){ return c.id === l.ch; })[0];
}
function lessonNum(l){
  var c = chOf(l.id);
  var i = c.lessons.indexOf(l) + 1;
  return c.num + "." + (i < 10 ? "0" + i : i);
}
function allLessonsInOrder(){
  var out = [];
  CHAPTERS.forEach(function(c){ out = out.concat(c.lessons); });
  return out;
}
function videosFor(lessonId){
  return VIDEOS.filter(function(v){ return v.lessons.indexOf(lessonId) >= 0; });
}
function ytWatch(id){ return "https://www.youtube.com/watch?v=" + id; }

      var hay = (l.title + " " + l.lede + " " + l.tags.join(" ") + " " + (l.body||"")).toLowerCase();

    html += '<div class="nav-group">';

              '<span class="t">' + esc(l.title) + '</span>' +

function renderMap(){
  var NW = 176, NH = 40, GAPX = 58, GAPY = 14, PADX = 28, PADY = 56;
  var colX = {};
  CHAPTERS.forEach(function(c,i){ colX[c.id] = PADX + i*(NW+GAPX); });

  var maxRows = 0;
  CHAPTERS.forEach(function(c){ if(c.lessons.length > maxRows) maxRows = c.lessons.length; });
  var W = PADX + CHAPTERS.length*(NW+GAPX) - GAPX + PADX;
  var H = PADY + maxRows*(NH+GAPY) + 24;

  var pos = {};
  CHAPTERS.forEach(function(c){
    c.lessons.forEach(function(l,i){
      pos[l.id] = { x: colX[c.id], y: PADY + i*(NH+GAPY), ch: c.id };
    });
  });

  var svg = '<svg id="map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="技巧之间的关联图">';
  svg += '<g id="edges">';
  var seen = {};
  L.forEach(function(l){
    (l.related||[]).forEach(function(rid){
      var a = pos[l.id], b = pos[rid];
      if(!a || !b) return;
      var key = l.id + ">" + rid;
      var rkey = rid + ">" + l.id;
      if(seen[rkey]) return;
      seen[key] = true;
      var d;
      if(a.ch === b.ch){
        var y1 = a.y + NH/2, y2 = b.y + NH/2;
        var ci = 0;
        CHAPTERS.forEach(function(c,k){ if(c.id === a.ch) ci = k; });
        var dir = ci < 2 ? 1 : -1;
        var ex = dir > 0 ? a.x + NW : a.x;
        var cx = ex + dir*30;
        d = "M" + ex + "," + y1 + " C" + cx + "," + y1 + " " + cx + "," + y2 + " " + ex + "," + y2;
      } else {
        var sx = a.x + NW, sy = a.y + NH/2;
        var tx = b.x, ty = b.y + NH/2;
        var off = Math.max(24, Math.abs(tx-sx)*0.35);
        d = "M" + sx + "," + sy + " C" + (sx+off) + "," + sy + " " + (tx-off) + "," + ty + " " + tx + "," + ty;
      }
      svg += '<path class="edge" data-a="' + l.id + '" data-b="' + rid + '" d="' + d + '" fill="none"/>';
    });
  });
  svg += '</g>';

  CHAPTERS.forEach(function(c){
    svg += '<text x="' + colX[c.id] + '" y="28" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace" font-size="10.5" letter-spacing="1.4">第 ' + c.num + ' 章</text>';
    svg += '<text x="' + colX[c.id] + '" y="45" fill="var(--ink)" font-family="Noto Serif SC,serif" font-size="13" font-weight="600">' + esc(c.title) + '</text>';
  });

  svg += '<g id="nodes">';
  L.forEach(function(l){
    var p = pos[l.id];
    var dn = isDone(l.id);
    svg += '<g class="node' + (dn ? " done" : "") + '" data-id="' + l.id + '" tabindex="0" role="button" style="cursor:pointer">';
    svg += '<rect class="box" x="' + p.x + '" y="' + p.y + '" width="' + NW + '" height="' + NH + '" rx="8"/>';
    if(dn) svg += '<rect class="bar" x="' + p.x + '" y="' + (p.y+1) + '" width="3.5" height="' + (NH-2) + '" rx="1.75"/>';
    svg += '<text x="' + (p.x+13) + '" y="' + (p.y+16) + '" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace" font-size="9">' + lessonNum(l) + '</text>';
    svg += '<text x="' + (p.x+13) + '" y="' + (p.y+30) + '" fill="var(--ink)" font-family="Noto Sans SC,sans-serif" font-size="12.5" font-weight="500">' + esc(l.title) + '</text>';
    svg += '</g>';
  });
  svg += '</g>';
  svg += '</svg>';

  var h = '<div class="map-wrap">';
  h += '<header class="hero" style="padding-top:34px">';
  h += '<div class="eyebrow">知识地图</div>';
  h += '<h1 style="font-size:clamp(24px,3.4vw,32px)">技巧之间的依赖</h1>';
  h += '<p class="lede" style="font-size:15px">每一条线是一次「相关」跳转。点任意一张卡就能跳过去。左栏是方法，越往右越是执行细节。</p>';
  h += '</header>';
  h += '<div class="map-scroll">' + svg + '</div>';
  h += '<div class="map-legend">';
  CHAPTERS.forEach(function(c){
    h += '<span><i style="background:var(--line-2)"></i>' + c.num + ' ' + esc(c.title) + '</span>';
  });
  h += '</div>';
  var canHover = window.matchMedia && window.matchMedia("(hover:hover)").matches;
  h += '<p class="map-tip">' + (canHover
    ? '悬停一张卡会高亮它所有的连线，点一下就能跳过去。带绿色左边条的课表示已经标记为已学。'
    : '左右滑动看图，点任意一张卡直接跳到那节课。带绿色左边条的课表示已经标记为已学。') + '</p>';
  h += '</div>';

  viewEl.innerHTML = h;

  var nodes = viewEl.querySelectorAll(".node");
  var edges = viewEl.querySelectorAll(".edge");
  function highlight(id){
    Array.prototype.forEach.call(edges, function(e){
      var on = (e.getAttribute("data-a") === id || e.getAttribute("data-b") === id);
      e.classList.toggle("on", on);
      e.classList.toggle("dim", !on);
    });
    Array.prototype.forEach.call(nodes, function(n){
      n.style.opacity = (n.getAttribute("data-id") === id) ? "1" : "0.45";
    });
  }
  function clear(){
    Array.prototype.forEach.call(edges, function(e){
      e.classList.remove("on");
      e.classList.remove("dim");
    });
    Array.prototype.forEach.call(nodes, function(n){ n.style.opacity = "1"; });
  }
  Array.prototype.forEach.call(nodes, function(n){
    n.addEventListener("mouseenter", function(){ highlight(n.getAttribute("data-id")); });
    n.addEventListener("mouseleave", clear);
    n.addEventListener("click", function(){ go("lesson", n.getAttribute("data-id")); });
    n.addEventListener("keydown", function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go("lesson", n.getAttribute("data-id")); }
    });
  });

  setNow("知识地图");
  currentView = "map"; currentId = null;
  renderNav();
}

function isFileProtocol(){
  return location.protocol === "file:";
}

function fileWarnHTML(){
  if(!isFileProtocol()) return "";
  return '<div class="file-warn"><b>内嵌播放需要 http:// 打开。</b>' +
    '你现在是直接双击文件（file://），浏览器不给页面来源（origin），YouTube 会拒绝嵌入并报「错误 153」。' +
    '所以这里改成了封面 + 跳转按钮，点一下就在 YouTube 新标签页里播。' +
    '想在页面里直接播，起个本地服务器：' +
    '<code>cd /home/dongliang/personal/works/write/chichi-training &amp;&amp; python3 -m http.server 8000</code>' +
    '然后打开 <code>http://127.0.0.1:8000/index.html</code></div>';
}

/* 页内播放器：直接展开在内容里（课程页在视频列表下方，视频库在网格上方） */

  var v = vById[id];
  if(!v) return "";
  var frame;
  if(isFileProtocol()){
    frame = '<a class="vp-fb" href="' + ytWatch(id) + '" target="_blank" rel="noopener noreferrer">' +
      '<img src="https://i.ytimg.com/vi/' + id + '/mqdefault.jpg" alt="">' +
      '<span class="vp-fb-play"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg></span>' +
      '<span class="vp-fb-txt">file:// 下无法内嵌 · 在 YouTube 播放 ↗</span></a>';
  } else {
    frame = '<iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0" title="' +
      esc(v.zh) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
  }
  var lesson = v.lessons.length ? byId[v.lessons[0]] : null;
  var h = '<div class="vid-player" data-vid="' + id + '">';
  h += '<div class="vp-frame">' + frame + '</div>';
  h += '<div class="vp-meta">';
  h += '<div class="vp-txt">' +
       '<span class="vp-topic">' + esc(v.topic) + '</span>' +
       '<span class="vp-title">' + esc(v.zh) + '</span>' +
       '<span class="vp-title-en">' + esc(v.title) + '</span>' +
       '<span class="vp-why">' + esc(v.why) + '</span></div>';
  h += '<div class="vp-acts">' +
       '<a href="' + ytWatch(id) + '" target="_blank" rel="noopener noreferrer">在 YouTube 打开 ↗</a>' +
       '<span class="vp-dur">' + esc(v.dur) + '</span>' +
       (lesson ? '<button class="vp-lesson" data-id="' + lesson.id + '">→ ' + lessonNum(lesson) + ' ' + esc(lesson.title) + '</button>' : '') +
       '<button class="vp-close">收起</button></div>';
  h += '</div></div>';
  return h;
}

function syncPlaying(){
  Array.prototype.forEach.call(document.querySelectorAll(".vid-card"), function(c){
    c.classList.toggle("playing", c.getAttribute("data-vid") === playerVid);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".vid-chip"), function(c){
    c.classList.toggle("on", c.getAttribute("data-vid") === playerVid);
  });
}

function mountPlayer(slot, id, scroll){
  if(!slot || !vById[id]) return;
  var cur = slot.querySelector(".vid-player");
  if(cur && cur.getAttribute("data-vid") === id){   /* 再点一次同一个 → 收起 */
    slot.innerHTML = "";
    playerVid = null;
    syncPlaying();
    return;
  }
  playerVid = id;
  slot.innerHTML = playerHTML(id);
  var lb = slot.querySelector(".vp-lesson");
  if(lb) lb.addEventListener("click", function(){ go("lesson", lb.getAttribute("data-id")); });
  var cb = slot.querySelector(".vp-close");
  if(cb) cb.addEventListener("click", function(){
    slot.innerHTML = ""; playerVid = null; syncPlaying();
  });
  syncPlaying();
  if(scroll){
    var top = slot.getBoundingClientRect().top + window.pageYOffset - 72;
    window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  }
}

/* ---------------- router ---------------- */

function go(view, id){
  if(view === "lesson" && id){
    history.replaceState(null, "", "#" + id);
    renderLesson(id);
  } else if(view === "map"){
    history.replaceState(null, "", "#map");
    renderMap();
  } else if(view === "drills"){
    history.replaceState(null, "", "#drills");
    renderDrills();
  } else if(view === "videos"){
    history.replaceState(null, "", "#videos");
    renderVideos(wantPlayerScroll ? playerVid : null);
  } else {
    history.replaceState(null, "", "#home");
    renderHome();
  }
  updateRailButtons();
}

function updateRailButtons(){
  var m = {home:"navHome", map:"navMap", drills:"navDrills", videos:"navVideos"};
  Object.keys(m).forEach(function(k){
    var el = document.getElementById(m[k]);
    if(!el) return;
    if(currentView === k) el.classList.add("on"); else el.classList.remove("on");
  });
}

/* ---------------- mobile rail ---------------- */

var rail = document.getElementById("rail");
var scrim = document.getElementById("scrim");
var menuBtn = document.getElementById("menuBtn");
var railScrollY = 0;
function openRail(){
  railScrollY = window.pageYOffset || 0;
  rail.classList.add("open"); scrim.classList.add("on");
  menuBtn.setAttribute("aria-expanded","true");
  // iOS Safari 不认 html{overflow:hidden}，用固定定位把背景按住
  document.body.style.position = "fixed";
  document.body.style.top = (-railScrollY) + "px";
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.width = "100%";
}
function closeRail(){
  if(!rail.classList.contains("open")) return;
  rail.classList.remove("open"); scrim.classList.remove("on");
  menuBtn.setAttribute("aria-expanded","false");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  document.body.style.width = "";
  window.scrollTo(0, railScrollY);
}
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeRail(); });

document.getElementById("menuBtn").addEventListener("click", openRail);
scrim.addEventListener("click", closeRail);

/* ---------------- boot ---------------- */

document.getElementById("navHome").addEventListener("click", function(){ go("home"); closeRail(); });
document.getElementById("navMap").addEventListener("click", function(){ go("map"); closeRail(); });
document.getElementById("navDrills").addEventListener("click", function(){ go("drills"); closeRail(); });
document.getElementById("navVideos").addEventListener("click", function(){ go("videos"); closeRail(); });

qEl.addEventListener("input", renderNav);

var hash = (location.hash || "").replace(/^#/, "");
if(hash && byId[hash]) { renderLesson(hash); }
else if(hash === "map") { renderMap(); }
else if(hash === "drills") { renderDrills(); }
else if(hash === "videos") { renderVideos(); }
else { renderHome(); }
updateRailButtons();

window.addEventListener("hashchange", function(){
  var h = (location.hash || "").replace(/^#/, "");
  if(h && byId[h]) { if(currentId !== h) renderLesson(h); }
  else if(h === "map"){ if(currentView !== "map") renderMap(); }
  else if(h === "drills"){ if(currentView !== "drills") renderDrills(); }
  else if(h === "videos"){ if(currentView !== "videos") renderVideos(); }
  else if(currentView !== "home"){ renderHome(); }
});

})();
</script>
